<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/assets/navigation.css">
    <link rel="preload" href="script.js" as="script">
    <link rel="preload" href="/assets/navigation.js" as="script">
    <link rel="shortcut icon" href="/assets/favicon.svg" type="image/x-icon">
    <title>Krebsgetränke-Upload</title>
    <script src="script.js" defer></script>
    <script src="/assets/navigation.js"></script>
  </head>
  <body>
    <div id="navPlaceholder" data-site="upload"></div>
    <main>
      <h2>Image-Upload</h2>
      <input type="password" id="token" placeholder="Token" hidden>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <label for="photoInput">Take Picture</label>
      <img id="preview" alt="Vorschau">
      <button id="uploadBtn" onclick="upload()" disabled>Commit</button>
      <p id="status"></p>
    </main>
  </body>
</html>
